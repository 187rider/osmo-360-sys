       # Create directory in /data/vendor/perfd for location with root:root permissions
       d /data/vendor/perfd 0755 root root - -
       # Change selinux context of new directory. Use Z to apply for subdirectories as well.
       T /data/vendor/perfd - - - - security.selinux=system_u:object_r:perf_hal_data_t:s0
       
