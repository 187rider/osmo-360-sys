{
    "plugins_configs": [
        {
            "type": "naming_rule",
            "groups": [
                {
                    "name": "EDCF_CONSUMER",
                    "desc": "Digital Camera naming rule",
                    "dl_path": "usr/lib/libdcam_fnm_ent2.so",
                    "creator": "ent_dcf_fname_mgr_v2_create"
                },
                {
                    "name": "verify_dcf_config",
                    "desc": "Verify DCF2.0 config integrity",
                    "dl_path": "usr/lib/libdcam_fnm_ent2.so",
                    "creator": "fname_runtime_file_verify"
                }
            ]
        },
        {
            "type": "storage",
            "common_parameter": [
                "video_timed_metadata_enable=1;",
                "video_embedded_dbginfo_enable=1;",
                "video_embedded_dbginfo_disable_list=1920x1080_11988,1920x1080_20000,3840x2160_11988,4096x2160_11988;"
            ],
            "groups": [
                {
                    "name": "emmc0",
                    "desc": "emmc0 storage",
                    "dl_path": "usr/lib/libdcam_storage_dev.so",
                    "creator": "cs_base_storage_dev_create",
                    "parameter":[
                        "priority=CAM_THREAD_PRI_NORMAL;",
                        "root=/mnt/media_rw/emulated;",
                        "reserved=256000;",
                        "# unit: Bytes, 0: no size limit;",
                        "split_size=3758096384;",
                        "optimal_block_size=65536;",
                        "optimal_block_size_vfat=32768;",
                        "optimal_block_size_exfat=65536;",
                        "vold_client_id=DUSS_STORAGE_UNKNOWN;",
                        "check_speed=false;",
                        "fs_supported=exfat;"
                    ]
                },
                {
                    "name": "sdcard0",
                    "desc": "sdcard0 storage",
                    "dl_path": "usr/lib/libdcam_storage_dev.so",
                    "creator": "cs_base_storage_dev_create",
                    "parameter":[
                        "priority=CAM_THREAD_PRI_LOW;",
                        "stable_time=5000;",
                        "root=/mnt/media_rw/sdcard0;",
                        "reserved=128000;",
                        "#unit: Bytes, 0: no size limit;",
                        "split_size=3758096384;",
                        "optimal_block_size=32768;",
                        "optimal_block_size_vfat=32768;",
                        "optimal_block_size_exfat=131072;",
                        "vold_client_id=DUSS_STORAGE_UNKNOWN;",
                        "check_speed=true;",
                        "rqstd_class_min=DUSS_HAL_SPEED_CLASS_10;",
                        "rqstd_uhs_min=DUSS_HAL_UHS_SPEED_GRADE_30MB_MORE;",
                        "card_reader=CARD_READER_MACHINE_USB0;",
                        "#format(string,char): io_file_name,connect_state_value;",
                        "card_reader_state_io=/sys/devices/platform/soc/soc:accessory/charger_state,1;"
                    ]
                }
            ]
        }
    ]
}
