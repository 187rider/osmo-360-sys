<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

    <policy user="hibernateuser">
        <allow own="org.Qti.HibernateService" />
        <allow send_destination="org.Qti.HibernateService" />
        <allow receive_sender="org.Qti.HibernateService" />
    </policy>

    <policy context="default">

        <deny send_destination="org.Qti.HibernateService"/>

        <allow send_destination="org.Qti.HibernateService"
                       send_interface="org.Qti.HibernateService.HibernateManager"
                       send_member="Hibernate"/>

        <allow send_destination="org.Qti.HibernateService"
                       send_interface="org.Qti.HibernateService.HibernateManager"
                       send_member="AreAllSubsystemsUp"/>

        <allow receive_sender="org.Qti.HibernateService"/>

    </policy>

</busconfig>
