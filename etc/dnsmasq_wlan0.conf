# 指定dnsmasq监听的网络接口
interface=wlan0

# 通过该选项绑定之前指定的监听接口，不接受来自
# 其他接口的请求
bind-interfaces

# 多网络接口情况下，指定接受DHCP请求的IP地址
listen-address=192.168.2.1

# 指定DHCP服务器分配的IP地址范围
dhcp-range=192.168.2.2,192.168.2.200,infinite

# 指定DHCP服务器分配的IP地址租约文件
dhcp-leasefile=/tmp/dnsmasq.leases

# 配置DHCP option选项，指定默认网关
dhcp-option=3,192.168.2.1

# 禁用内置的域名解析功能，仅启用DHCP功能
nodns

# 禁用dnsmasq的ping应答功能
no-ping

# 指定dnsmasq为DHCP服务器的授权服务器，表示dnsmasq
# 将对所有DHCP请求做出回应，并且不会将请求转发到
# 其他DHCP服务器
dhcp-authoritative

# 禁用使用`/etc/resolv.conf`文件中的DNS服务器配置
no-resolv

# 禁用文件轮询，这样dnsmasq将在接收到系统通知时
# 才读取配置文件，而不是连续监听文件的变化
no-poll

