# configuration file for Weston
[core]
idle-time=0
backend=sdm-backend.so
repaint-window=10

# [DJI MODIFIED_BY_DJI_START], arnold.zhang, enable dpu rotate for dsi-1
[output]
name=DSI-1-61
mode=on
transform=rotate-270
# [DJI MODIFIED_BY_DJI_END], arnold.zhang, enable dpu rotate for dsi-1

[output]
name=DP-1
mode=on

[shell]
clock-format=seconds
logo=/usr/share/weston/logo-oq101.bmp
close-animation=none
